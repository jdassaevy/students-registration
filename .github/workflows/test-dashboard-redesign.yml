name: Validar Dashboard 2.0

on:
  push:
    branches:
      - design/dashboard-2-ui-redesign
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  javascript-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rodar testes .mjs
        run: node --test app/js/tests/*.test.mjs

      - name: Rodar teste de valores monetários
        run: node app/js/tests/money-input.test.js
