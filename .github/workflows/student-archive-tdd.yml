name: Student Archive TDD

on:
  push:
    branches:
      - fix/student-archive-removal-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  archive-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run archive schema contract
        run: node app/js/tests/student-archive-schema.test.mjs
      - name: Run full JavaScript suite
        shell: bash
        run: |
          set -euo pipefail
          for file in app/js/tests/*.test.js app/js/tests/*.test.mjs; do
            node "$file"
          done
