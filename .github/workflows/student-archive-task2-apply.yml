name: Apply Student Archive Task 2

on:
  push:
    branches:
      - fix/student-archive-removal

permissions:
  contents: write

jobs:
  apply-task2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded Task 2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/js/core/script.js')
          source = path.read_text()

          loader_pattern = re.compile(
              r"(?P<indent>\s*)\.from\('students'\)\n"
              r"(?P=indent)\.select\('\*'\)\n"
              r"(?P=indent)\.order\('created_at', \{ascending: false\}\)"
          )

          def add_active_filter(match):
              indent = match.group('indent')
              return (
                  f"{indent}.from('students')\n"
                  f"{indent}.select('*')\n"
                  f"{indent}.is('archived_at', null)\n"
                  f"{indent}.order('created_at', {{ascending: false}})"
              )

          source, loader_count = loader_pattern.subn(add_active_filter, source)
          if loader_count != 2:
              raise SystemExit(f'Expected exactly 2 unfiltered student loaders, found {loader_count}')

          remove_pattern = re.compile(
              r"async function removeCouple\(id\) \{[\s\S]*?\n\}(?=\nasync function removeClass\(id\))"
          )
          matches = list(remove_pattern.finditer(source))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly 1 removeCouple block, found {len(matches)}')
          legacy_block = matches[0].group(0)
          if ".from('students')" not in legacy_block or '.delete()' not in legacy_block:
              raise SystemExit('removeCouple no longer matches the legacy hard-delete shape')

          new_remove = "\n".join([
              "async function removeCouple(id) {",
              "    const c = couples.find(x => x.id === id);",
              "    if (!c || !confirm(",
              "        `Excluir o cadastro de ${c.person1}${c.person2",
              "            ? ` e ${c.person2}`",
              "            : ''}?`",
              "    )) ",
              "        return;",
              "",
              "    const {data, error} = await db.rpc('remove_student_from_operation', {",
              "        p_student_id: id",
              "    });",
              "",
              "    if (error || !['archived', 'deleted'].includes(data)) {",
              "        console.warn('student removal failed', error?.message || data);",
              "        return toast('Não foi possível remover o cadastro.');",
              "    }",
              "",
              "    couples = couples.filter(x => x.id !== id);",
              "    render();",
              "    toast(",
              "        data === 'archived'",
              "            ? 'Cadastro removido. Histórico financeiro preservado.'",
              "            : 'Cadastro excluído.'",
              "    );",
              "}"
          ])
          source = source[:matches[0].start()] + new_remove + source[matches[0].end():]
          path.write_text(source)
          PY
      - name: Commit Task 2 implementation when changed
        run: |
          if git diff --quiet -- app/js/core/script.js; then
            echo 'Task 2 patch already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/js/core/script.js
          git commit -m 'fix: remove students with archive-aware flow'
          git push origin HEAD:fix/student-archive-removal
