name: Apply Student Archive Task 5

on:
  push:
    branches:
      - fix/student-archive-removal

permissions:
  contents: write

jobs:
  apply-task5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded backend patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str, old, new, label):
              path = Path(path_str)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, found {count}')
              path.write_text(source.replace(old, new, 1))

          # process-reminders: current automation must never load archived students.
          replace_once(
              'supabase/functions/process-reminders/index.ts',
              'admin.from("students").select("id,user_id,class_id,person1,person2,person1_phone,person2_phone,person1_whatsapp_consent,person2_whatsapp_consent,fees,payments").not("class_id", "is", null)',
              'admin.from("students").select("id,user_id,class_id,person1,person2,person1_phone,person2_phone,person1_whatsapp_consent,person2_whatsapp_consent,fees,payments").is("archived_at", null).not("class_id", "is", null)',
              'reminder active-student query'
          )

          # payment-lifecycle: normal payment operations load active students only.
          replace_once(
              'supabase/functions/payment-lifecycle/index.ts',
              '.eq("id", studentId).single();',
              '.eq("id", studentId).is("archived_at", null).single();',
              'normal lifecycle active-student guard'
          )

          # Historical receipt repair must still find the archived student, but know its state.
          replace_once(
              'supabase/functions/payment-lifecycle/index.ts',
              '.select("id,class_id,academy_id,person1,person2,person1_phone,person2_phone,person1_whatsapp_consent,person2_whatsapp_consent")',
              '.select("id,class_id,academy_id,archived_at,person1,person2,person1_phone,person2_phone,person1_whatsapp_consent,person2_whatsapp_consent")',
              'repair archived_at selection'
          )

          replace_once(
              'supabase/functions/payment-lifecycle/index.ts',
              '''      if (repairStudent.academy_id !== receipt.academy_id) {
        return json({ error: "Receipt tenant mismatch" }, 409);
      }

      const { data: repairSettingsRow, error: repairSettingsError }''',
              '''      if (repairStudent.academy_id !== receipt.academy_id) {
        return json({ error: "Receipt tenant mismatch" }, 409);
      }
      const repairStudentArchived = Boolean(repairStudent.archived_at);

      const { data: repairSettingsRow, error: repairSettingsError }''',
              'repair archived state resolution'
          )

          replace_once(
              'supabase/functions/payment-lifecycle/index.ts',
              '''      const repairWhatsapp: Record<string, string> = {
        receipt_document: repairSettings.receipt_delivery_enabled
          ? (repairEligible ? (repairMetaReady ? "ready" : "not_configured") : "skipped")
          : "disabled",
      };''',
              '''      const repairWhatsapp: Record<string, string> = {
        receipt_document: repairStudentArchived
          ? "skipped"
          : repairSettings.receipt_delivery_enabled
            ? (repairEligible ? (repairMetaReady ? "ready" : "not_configured") : "skipped")
            : "disabled",
      };''',
              'repair archived status response'
          )

          replace_once(
              'supabase/functions/payment-lifecycle/index.ts',
              '''      if (
        repairEligible && repairMetaReady && repairSettings.receipt_delivery_enabled &&
        repairedReceipt.storage_path
      ) {''',
              '''      if (
        repairEligible && repairMetaReady && repairSettings.receipt_delivery_enabled &&
        !repairStudentArchived && repairedReceipt.storage_path
      ) {''',
              'repair outbound archive guard'
          )

          # Direct retries must fail before creating a new automation log.
          replace_once(
              'supabase/functions/retry-automation-message/index.ts',
              '''    .eq("id", source.student_id)
    .single();''',
              '''    .eq("id", source.student_id)
    .is("archived_at", null)
    .single();''',
              'retry active-student guard'
          )
          PY
      - name: Commit Task 5 implementation when changed
        run: |
          if git diff --quiet -- supabase/functions/payment-lifecycle/index.ts supabase/functions/process-reminders/index.ts supabase/functions/retry-automation-message/index.ts; then
            echo 'Task 5 patches already applied; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/payment-lifecycle/index.ts supabase/functions/process-reminders/index.ts supabase/functions/retry-automation-message/index.ts
          git commit -m 'fix: block archived students from backend operations'
          git push origin HEAD:fix/student-archive-removal
