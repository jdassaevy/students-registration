name: Academy profile final regression

on:
  push:
    branches:
      - feat/academy-profile-and-receipts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full Node suite
        run: node --test app/js/tests/*.test.js app/js/tests/*.test.mjs
