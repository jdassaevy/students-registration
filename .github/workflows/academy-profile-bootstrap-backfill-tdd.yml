name: Academy profile bootstrap backfill TDD

on:
  push:
    branches:
      - feat/academy-profile-and-receipts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify legacy identity bootstrap contract
        run: node --test app/js/tests/academy-profile-bootstrap-backfill.test.mjs
