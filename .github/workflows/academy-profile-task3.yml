name: Academy profile Task 3 TDD

on:
  push:
    branches:
      - feat/academy-profile-and-receipts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test app/js/tests/payment-lifecycle-academy-identity.test.mjs
