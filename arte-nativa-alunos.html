<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#34150f">
        <title>Gestão de Alunos | Arte Nativa</title>
        <style>
            :root {
                --wine: #5b2118;
                --wine-dark: #34150f;
                --terracotta: #a64b35;
                --cream: #f6f0e6;
                --paper: #fffdf8;
                --ink: #2c2521;
                --muted: #746b65;
                --line: #e7ddd0;
                --green: #2f7d58;
                --red: #b5463c;
                --shadow: 0 18px 50px rgba(70, 34, 23, .10);
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
                color: var(--ink);
                background: var(--cream);
            }

            button,
            input,
            select {
                font: inherit;
            }

            button {
                cursor: pointer;
            }

            .topbar {
                min-height: 180px;
                padding: 32px clamp(20px, 5vw, 72px) 64px;
                color: white;
                background: radial-gradient(circle at 80% 0%, rgba(255,255,255,.12), transparent 28%), linear-gradient(135deg, var(--wine-dark), var(--wine));
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .brand-mark {
                width: 52px;
                height: 52px;
                display: grid;
                place-items: center;
                border: 1px solid rgba(255,255,255,.28);
                border-radius: 50%;
                font: 700 22px Georgia, serif;
                background: rgba(255,255,255,.08);
            }
            .brand small {
                display: block;
                opacity: 0.72;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                font-size: 10px;
            }
            .brand strong {
                font: 700 23px Georgia, serif;
                letter-spacing: 0.02em;
            }
            .top-copy {
                margin-top: 28px;
            }
            .top-copy h1 {
                margin: 0 0 7px;
                font: 700 clamp(28px, 4vw, 44px) Georgia, serif;
            }
            .top-copy p {
                margin: 0;
                color: rgba(255,255,255,.72);
            }
            .app {
                width: min(1180px, calc(100% - 32px));
                margin: -38px auto 48px;
                position: relative;
            }
            .stats {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 14px;
                margin-bottom: 18px;
            }
            .stat {
                background: var(--paper);
                border: 1px solid rgba(255,255,255,.75);
                border-radius: 18px;
                padding: 18px 20px;
                box-shadow: var(--shadow);
            }
            .stat span {
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }
            .stat strong {
                display: block;
                margin-top: 7px;
                font-size: 30px;
                color: var(--wine-dark);
            }
            .panel {
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: 22px;
                box-shadow: var(--shadow);
                overflow: hidden;
            }
            .toolbar {
                padding: 22px;
                display: flex;
                justify-content: space-between;
                gap: 14px;
                align-items: center;
                border-bottom: 1px solid var(--line);
            }
            .search {
                flex: 1;
                max-width: 500px;
                position: relative;
            }
            .search input {
                width: 100%;
                height: 46px;
                padding: 0 16px 0 43px;
                border: 1px solid var(--line);
                background: #fff;
                border-radius: 12px;
                outline: none;
            }
            .search input:focus {
                border-color: var(--terracotta);
                box-shadow: 0 0 0 3px rgba(166,75,53,.12);
            }
            .search::before {
                content: '⌕';
                position: absolute;
                left: 16px;
                top: 8px;
                font-size: 25px;
                color: var(--muted);
            }
            .btn {
                border: 0;
                border-radius: 12px;
                min-height: 46px;
                padding: 0 18px;
                font-weight: 750;
                transition: 0.18s ease;
            }
            .btn:hover {
                transform: translateY(-1px);
            }
            .btn-primary {
                color: #fff;
                background: var(--wine);
                box-shadow: 0 8px 18px rgba(91,33,24,.22);
            }
            .btn-light {
                background: #f2eae0;
                color: var(--wine);
            }
            .table-wrap {
                overflow-x: auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 840px;
            }
            th {
                padding: 14px 20px;
                color: var(--muted);
                font-size: 11px;
                text-align: left;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                background: #faf6f0;
            }
            td {
                padding: 17px 20px;
                border-top: 1px solid var(--line);
                vertical-align: middle;
            }
            .couple strong {
                display: block;
                font-size: 15px;
            }
            .couple small {
                color: var(--muted);
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                border: 0;
                border-radius: 999px;
                padding: 7px 11px;
                font-size: 12px;
                font-weight: 750;
            }
            .pill::before {
                content: '';
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: currentColor;
            }
            .paid {
                color: var(--green);
                background: #e6f4ec;
            }
            .pending {
                color: var(--red);
                background: #fbeae7;
            }
            .payments {
                display: flex;
                gap: 7px;
            }
            .month {
                width: 36px;
                height: 36px;
                border-radius: 10px;
                border: 1px solid var(--line);
                color: var(--muted);
                background: white;
                font-size: 12px;
                font-weight: 800;
            }
            .month.on {
                color: white;
                background: var(--green);
                border-color: var(--green);
            }
            .count {
                color: var(--muted);
                font-size: 13px;
                white-space: nowrap;
            }
            .actions {
                display: flex;
                gap: 6px;
            }
            .icon-btn {
                width: 36px;
                height: 36px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: white;
                color: var(--wine);
            }
            .icon-btn:hover {
                background: #f7eee6;
            }
            .empty {
                text-align: center;
                padding: 60px 20px !important;
                color: var(--muted);
            }
            .empty b {
                display: block;
                color: var(--ink);
                margin-bottom: 5px;
            }
            dialog {
                width: min(560px, calc(100% - 28px));
                border: 0;
                border-radius: 22px;
                padding: 0;
                box-shadow: 0 30px 90px rgba(30,12,8,.3);
            }
            dialog::backdrop {
                background: rgba(35,19,15,.62);
                backdrop-filter:blur(4px);
            }
            .modal-head {
                padding: 24px 26px 18px;
                border-bottom: 1px solid var(--line);
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
            .modal-head h2 {
                margin: 0 0 4px;
                font: 700 26px Georgia,serif;
                color: var(--wine-dark);
            }
            .modal-head p {
                margin: 0;
                color: var(--muted);
                font-size: 13px;
            }
            .close {
                border: 0;
                background: transparent;
                font-size: 24px;
                color: var(--muted);
            }
            form {
                padding: 24px 26px 26px;
            }
            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
            label {
                display: block;
                color: var(--muted);
                font-size: 12px;
                font-weight: 750;
                margin-bottom: 7px;
            }
            .field input {
                width: 100%;
                height: 45px;
                border: 1px solid var(--line);
                border-radius: 11px;
                padding: 0 13px;
                outline: none;
            }
            .field input:focus {
                border-color: var(--terracotta);
                box-shadow: 0 0 0 3px rgba(166,75,53,.1);
            }
            .wide {
                grid-column: 1/-1;
            }
            .checks {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
            }
            .check {
                flex: 1;
                min-width: 110px;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px;
                background: #faf7f2;
            }
            .check input {
                accent-color: var(--green);
            }
            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 10px;
                margin-top: 24px;
            }
            .toast {
                position: fixed;
                right: 20px;
                bottom: 20px;
                padding: 13px 17px;
                border-radius: 12px;
                background: var(--wine-dark);
                color: white;
                box-shadow: var(--shadow);
                opacity: 0;
                transform: translateY(20px);
                pointer-events: none;
                transition: 0.25s;
            }
            .toast.show {
                opacity: 1;
                transform: translateY(0);
            }
            @media(max-width:760px) {
                .stats {
                    grid-template-columns: 1fr 1fr;
                }
                .toolbar {
                    align-items: stretch;
                    flex-direction: column;
                }
                .search {
                    max-width: none;
                }
                .grid {
                    grid-template-columns: 1fr;
                }
                .wide {
                    grid-column: auto;
                }
                .topbar {
                    padding-bottom: 60px;
                }
                .stat strong {
                    font-size: 25px;
                }
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">AN</div>
                <div>
                    <small>Família</small>
                    <strong>Arte Nativa</strong>
                </div>
            </div>
            <div class="top-copy">
                <h1>Gestão de alunos</h1>
                <p>Inscrições e mensalidades dos casais em um só lugar.</p>
            </div>
        </header>
        <main class="app">
            <section class="stats" aria-label="Resumo">
                <article class="stat">
                    <span>Casais inscritos</span>
                    <strong id="statTotal">0</strong>
                </article>
                <article class="stat">
                    <span>Inscrições pagas</span>
                    <strong id="statEntries">0</strong>
                </article>
                <article class="stat">
                    <span>Mensalidades pagas</span>
                    <strong id="statPayments">0</strong>
                </article>
                <article class="stat">
                    <span>Pendências</span>
                    <strong id="statPending">0</strong>
                </article>
            </section>
            <section class="panel">
                <div class="toolbar">
                    <div class="search"><input
                        id="search"
                        type="search"
                        placeholder="Buscar pelo nome do casal..."
                        aria-label="Buscar casais"></div>
                    <button class="btn btn-primary" id="newBtn">＋ Cadastrar casal</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Casal</th>
                                <th>Inscrição</th>
                                <th>Mensalidades</th>
                                <th>Progresso</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="list"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <dialog id="modal">
            <div class="modal-head">
                <div>
                    <h2 id="modalTitle">Cadastrar casal</h2>
                    <p>Preencha os nomes e a situação dos pagamentos.</p>
                </div>
                <button class="close" type="button" id="closeBtn" aria-label="Fechar">×</button>
            </div>
            <form id="form">
                <input type="hidden" id="editingId">
                <div class="grid">
                    <div class="field">
                        <label for="person1">Nome da primeira pessoa</label><input id="person1" required="required" placeholder="Ex.: Ana Silva"></div>
                    <div class="field">
                        <label for="person2">Nome da segunda pessoa</label><input id="person2" required="required" placeholder="Ex.: João Souza"></div>
                    <div class="wide">
                        <label>Pagamentos</label>
                        <div class="checks">
                            <label class="check"><input type="checkbox" id="entry">
                                Inscrição paga</label>
                            <label class="check"><input type="checkbox" id="m1">
                                1ª mensalidade</label>
                            <label class="check"><input type="checkbox" id="m2">
                                2ª mensalidade</label>
                            <label class="check"><input type="checkbox" id="m3">
                                3ª mensalidade</label>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-light" id="cancelBtn">Cancelar</button>
                    <button class="btn btn-primary" type="submit">Salvar casal</button>
                </div>
            </form>
        </dialog>
        <div class="toast" id="toast"></div>

        <script>
            const KEY = 'arteNativaCasais_v1';
    let couples = JSON.parse(localStorage.getItem(KEY) || '[]');
    const $ = id => document.getElementById(id);
    const save = () => { localStorage.setItem(KEY, JSON.stringify(couples)); render(); };
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function toast(message){ $('toast').textContent=message; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2200); }
    function stats(){
      const total=couples.length, entries=couples.filter(c=>c.entry).length, paid=couples.reduce((n,c)=>n+c.months.filter(Boolean).length,0);
      $('statTotal').textContent=total; $('statEntries').textContent=entries; $('statPayments').textContent=paid; $('statPending').textContent=(total-entries)+(total*3-paid);
    }
    function render(){
      const q=$('search').value.toLowerCase().trim();
      const filtered=couples.filter(c=>(c.person1+' '+c.person2).toLowerCase().includes(q));
      $('list').innerHTML = filtered.length ? filtered.map(c=>{
        const paid=c.months.filter(Boolean).length;
        return `<tr><td class="couple"><strong>${escapeHtml(c.person1)} &amp; ${escapeHtml(c.person2)}</strong><small>Cadastrado em ${c.createdAt}</small></td>
          <td><button class="pill ${c.entry?'paid':'pending'}" onclick="toggleEntry('${c.id}')">${c.entry?'Paga':'Pendente'}</button></td>
          <td><div class="payments">${c.months.map((on,i)=>`<button class="month ${on?'on':''}" title="${i+1}ª mensalidade" onclick="toggleMonth('${c.id}',${i})">${on?'✓':i+1}</button>`).join('')}</div></td>
          <td class="count"><b>${paid} de 3</b> pagas</td><td><div class="actions"><button class="icon-btn" title="Editar" onclick="editCouple('${c.id}')">✎</button><button class="icon-btn" title="Excluir" onclick="removeCouple('${c.id}')">⌫</button></div></td></tr>`;
      }).join('') : `<tr><td colspan="5" class="empty"><b>${q?'Nenhum casal encontrado':'Nenhum casal cadastrado'}</b>${q?'Tente pesquisar outro nome.':'Clique em “Cadastrar casal” para começar.'}</td></tr>`;
      stats();
    }
    function openNew(){ $('form').reset(); $('editingId').value=''; $('modalTitle').textContent='Cadastrar casal'; $('modal').showModal(); $('person1').focus(); }
    function editCouple(id){ const c=couples.find(x=>x.id===id); if(!c)return; $('editingId').value=id; $('person1').value=c.person1; $('person2').value=c.person2; $('entry').checked=c.entry; c.months.forEach((v,i)=>$('m'+(i+1)).checked=v); $('modalTitle').textContent='Editar casal'; $('modal').showModal(); }
    function toggleEntry(id){ const c=couples.find(x=>x.id===id); c.entry=!c.entry; save(); toast('Inscrição atualizada.'); }
    function toggleMonth(id,index){ const c=couples.find(x=>x.id===id); c.months[index]=!c.months[index]; save(); toast('Mensalidade atualizada.'); }
    function removeCouple(id){ const c=couples.find(x=>x.id===id); if(confirm(`Excluir o cadastro de ${c.person1} e ${c.person2}?`)){ couples=couples.filter(x=>x.id!==id); save(); toast('Cadastro excluído.'); } }
    $('form').addEventListener('submit', e=>{ e.preventDefault(); const id=$('editingId').value; const data={person1:$('person1').value.trim(),person2:$('person2').value.trim(),entry:$('entry').checked,months:[1,2,3].map(i=>$('m'+i).checked)}; if(id){ const old=couples.find(c=>c.id===id); Object.assign(old,data); toast('Cadastro atualizado.'); } else { couples.unshift({id:crypto.randomUUID(),createdAt:new Date().toLocaleDateString('pt-BR'),...data}); toast('Casal cadastrado!'); } save(); $('modal').close(); });
    $('newBtn').onclick=openNew; $('closeBtn').onclick=()=> $('modal').close(); $('cancelBtn').onclick=()=> $('modal').close(); $('search').oninput=render;
    $('modal').addEventListener('click',e=>{ if(e.target===$('modal')) $('modal').close(); });
    render();
  </script>
</body>
</html>
