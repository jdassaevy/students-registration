name: Temporary WhatsApp Template TDD

on:
  push:
    branches:
      - fix/whatsapp-payment-confirmation-template
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run payment lifecycle template test
        run: node --test app/js/tests/payment-lifecycle-monthly-receipt.test.mjs
