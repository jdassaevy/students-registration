name: Monthly receipt separation validation

on:
  push:
    branches:
      - feat/separate-payment-receipts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full Node suite
        run: node --test app/js/tests/*.test.js app/js/tests/*.test.mjs
